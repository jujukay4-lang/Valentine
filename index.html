<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    
      background: linear-gradient(135deg, #b11226, #ff5c8a);
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #333;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #yesBtn {
      background-color: #e63946;
      color: white;
      margin-right: 10px;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background-color: #ccc;
      color: #555;
      position: absolute;
    }

    .tagline {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

    /* Fade-in animation for image */
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Thando 💖</h1>
    <p>Will you please be my Valentine?</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="tagline">
      Seems like no is abit shy 🫣
    </div>
  </div>

  <script>
    // NO button dodging
    const noBtn = document.getElementById('noBtn');

    function moveButton() {
      const x = Math.random() * 250;
      const y = Math.random() * 80;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    // YES click - cinematic final page
    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          width:100vw;
          position:relative;
          font-family:Poppins, sans-serif;
          overflow:hidden;
          display:flex;
          justify-content:center;
          align-items:center;
          background:radial-gradient(circle at top, #8b0000, #000000);
          text-align:center;
        ">
          <!-- Canvas for hearts -->
          <canvas id="hearts" style="
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:1;
          "></canvas>

          <!-- Content centered above hearts -->
          <div style="
            position:relative;
            z-index:2;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
          ">
            <h1 style="color:#ff4d6d; margin-bottom:20px;">
              🥂
            </h1>

            <img 
              src="us.jpg"  /* Replace with your uploaded image */
              alt="Us ❤️"
              style="
                width:260px;
                max-width:90%;
                border-radius:20px;
                box-shadow:0 15px 40px rgba(0,0,0,0.8);
                opacity:0;
                animation: fadeIn 2s ease forwards;
              "
            />

            <p style="
              margin-top:20px;
              color:#f1f1f1;
              font-size:18px;
            ">
              Kupholiwe 😌
            </p>
          </div>
        </div>
      `;

      launchHearts();
    }

    // Heart particle animation - slower above, faster below
    function launchHearts() {
      const canvas = document.getElementById('hearts');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const hearts = Array.from({length: 80}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 20 + 10,
        speed: Math.random() * 1 + 0.5,
        alpha: Math.random() * 0.5 + 0.5
      }));

      function drawHeart(x, y, size, alpha) {
        ctx.fillStyle = `rgba(255,0,0,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size, y + size/3);
        ctx.bezierCurveTo(x - size, y + size, x, y + size*1.5, x, y + size*2);
        ctx.bezierCurveTo(x, y + size*1.5, x + size, y + size, x + size, y + size/3);
        ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y);
        ctx.closePath();
        ctx.fill();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        hearts.forEach(h => {
          const centerY = canvas.height / 2;
          let adjustedSpeed = h.speed;

          if(h.y < centerY) {
            adjustedSpeed = h.speed * 0.5; // slower above
          } else {
            adjustedSpeed = h.speed * 1.5; // faster below
          }

          drawHeart(h.x, h.y, h.size, h.alpha);
          h.y -= adjustedSpeed;

          if (h.y + h.size*2 < 0) {
            h.y = canvas.height + h.size*2;
            h.x = Math.random() * canvas.width;
          }
        });

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>

</body>
</html>
