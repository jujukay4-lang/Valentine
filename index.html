<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #333;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #yesBtn {
      background-color: #e63946;
      color: white;
      margin-right: 10px;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      background-color: #ccc;
      color: #555;
      position: absolute;
    }

    .tagline {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Thando ♥️</h1>
    <p>Will you be my Valentine?</p>

    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">Yes 💕</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="tagline">
      Seems like no is abit shy 🫣
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    function moveButton() {
      const x = Math.random() * 250;
      const y = Math.random() * 80;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    function yesClicked() {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family:Poppins, sans-serif;
      text-align:center;
      padding:20px;">

      <h1 style="color:white; margin-bottom:20px;">
        To us 🥂💖
      </h1>

      <img 
  src="us.jpg"
  alt="Us ❤️"
  style="
    width:260px;
    max-width:90%;
    border-radius:20px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
  "
/>
      <p style="
        margin-top:20px;
        color:white;
        font-size:18px;
      ">
        Nazoke 😌
      </p>
    </div>
  `;
    }
  </script>

</body>
</html>
